services:
  - type: web
    name: htu-src-system
    runtime: python
    plan: free
    region: ohio

    buildCommand: |
      pip install -r requirements.txt
      python download_nltk_data.py

    startCommand: gunicorn --worker-class eventlet -w 1 app:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: htu-src-db
          property: connectionString

      - key: SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: htu-src-db
          property: connectionString

databases:
  - name: htu-src-db
    plan: free
    region: ohio
    databaseName: htu_src_feedback
    user: htu_src_user
