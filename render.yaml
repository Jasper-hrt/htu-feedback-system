services:
  - type: web
    name: htu-src-system
    runtime: python
    plan: free
    region: ohio

    buildCommand: |
      pip install -r requirements.txt
      python download_nltk_data.py

    # Use the eventlet worker class so Flask-SocketIO WebSockets work.
    # -w 1 is required: SocketIO rooms/state are in-memory, so multiple
    # workers would break real-time chat.
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: htu-src-db
          property: connectionString

      - key: SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: htu-src-db
          property: connectionString

databases:
  - name: htu-src-db
    plan: free
    region: ohio
    databaseName: htu_src_feedback
    user: htu_src_user

