services:
  - type: web
    name: htu-src-system
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt && python download_nltk_data.py
    startCommand: gunicorn -k eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: htu-src-db
          property: connectionString
      - key: SQLALCHEMY_DATABASE_URI
        fromDatabase:
          name: htu-src-db
          property: connectionString

databases:
  - name: htu-src-db
    region: ohio
    plan: free
    databaseName: htu_src_feedback
    user: htu_src_user
</｜｜DSML｜｜parameter>
