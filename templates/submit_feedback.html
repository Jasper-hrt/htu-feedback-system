{% extends "base.html" %}

{% block content %}
<div class="submit-page">
    
    <!-- Header -->
    <div class="submit-header">
        <a href="/student/dashboard" class="submit-back">← Back</a>
        <h1>✍️ Submit Feedback</h1>
        <p>Share your concerns, suggestions, or feedback with the SRC</p>
    </div>

    <!-- Form -->
    <form method="POST" class="submit-form" id="feedbackForm" novalidate>
        {{ csrf_field() }}
        
        <!-- Category Section -->
        <div class="submit-section">
            <label class="submit-label">📂 Select Category <span class="text-danger">*</span></label>
            <div class="submit-categories">
                <label class="submit-cat">
                    <input type="radio" name="category" value="Wi-Fi Issues" required>
                    <span class="submit-cat-icon">📶</span>
                    <span class="submit-cat-name">Wi-Fi</span>
                </label>
                <label class="submit-cat">
                    <input type="radio" name="category" value="Maintenance">
                    <span class="submit-cat-icon">🔧</span>
                    <span class="submit-cat-name">Maintenance</span>
                </label>
                <label class="submit-cat">
                    <input type="radio" name="category" value="Staff Conduct">
                    <span class="submit-cat-icon">👤</span>
                    <span class="submit-cat-name">Staff</span>
                </label>
                <label class="submit-cat">
                    <input type="radio" name="category" value="Safety Concern">
                    <span class="submit-cat-icon">🛡️</span>
                    <span class="submit-cat-name">Safety</span>
                </label>
                <label class="submit-cat">
                    <input type="radio" name="category" value="Accommodation">
                    <span class="submit-cat-icon">🏠</span>
                    <span class="submit-cat-name">Housing</span>
                </label>
                <label class="submit-cat">
                    <input type="radio" name="category" value="Catering">
                    <span class="submit-cat-icon">🍽️</span>
                    <span class="submit-cat-name">Catering</span>
                </label>
                <label class="submit-cat">
                    <input type="radio" name="category" value="Academics">
                    <span class="submit-cat-icon">📚</span>
                    <span class="submit-cat-name">Academics</span>
                </label>
                <label class="submit-cat">
                    <input type="radio" name="category" value="Financial">
                    <span class="submit-cat-icon">💰</span>
                    <span class="submit-cat-name">Financial</span>
                </label>
                <label class="submit-cat">
                    <input type="radio" name="category" value="Other">
                    <span class="submit-cat-icon">📋</span>
                    <span class="submit-cat-name">Other</span>
                </label>
            </div>
            <div class="submit-error" id="categoryError">⚠️ Please select a category</div>
        </div>

        <!-- Feedback Text -->
        <div class="submit-section">
            <label class="submit-label">📝 Your Feedback <span class="text-danger">*</span></label>
            <textarea name="feedback_text" id="feedbackText" class="submit-textarea" rows="4" placeholder="Describe your feedback, concern, or suggestion in detail..." maxlength="1000" required></textarea>
            <div class="submit-char-count"><span id="charCount">0</span>/1000</div>
            <div class="submit-error" id="textError">⚠️ Please provide at least 10 characters</div>
        </div>

        <!-- Location -->
        <div class="submit-section">
            <label class="submit-label">📍 Location (optional)</label>
            <input type="text" name="location" class="submit-input" placeholder="e.g. Science Lab, Block A, Main Hall">
        </div>

        <!-- Anonymous -->
        <div class="submit-section">
            <label class="submit-check">
                <input type="checkbox" name="anonymous" id="anonymousCheck">
                <span>🙈 Submit anonymously</span>
            </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">🚀 Submit Feedback</button>
    </form>
</div>

<style>
.submit-page { max-width: 600px; margin: 0 auto; padding: 1.25rem 1rem; }

/* Header */
.submit-header { margin-bottom: 1.5rem; }
.submit-back { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--text-secondary); text-decoration: none; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.75rem; }
.submit-back:hover { color: var(--primary); }
.submit-header h1 { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); margin: 0 0 0.25rem; }
.submit-header p { font-size: 0.8rem; color: var(--text-secondary); margin: 0; }

/* Form */
.submit-form { display: flex; flex-direction: column; gap: 1.25rem; }

/* Section */
.submit-section { display: flex; flex-direction: column; gap: 0.5rem; }
.submit-label { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
.text-danger { color: #ef4444; }

/* Categories */
.submit-categories { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
.submit-cat { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; padding: 0.6rem 0.4rem; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 0.5rem; cursor: pointer; transition: all 0.15s ease; text-align: center; }
.submit-cat:hover { border-color: #3b82f6; transform: translateY(-2px); }
.submit-cat.selected { border-color: #3b82f6; background: rgba(59,130,246,0.08); }
.submit-cat input { display: none; }
.submit-cat-icon { font-size: 1.25rem; }
.submit-cat-name { font-size: 0.7rem; font-weight: 600; color: var(--text-primary); }

/* Textarea */
.submit-textarea { width: 100%; padding: 0.65rem; border: 1px solid var(--border-color); border-radius: 0.5rem; background: var(--card-bg); color: var(--text-primary); font-size: 0.85rem; resize: vertical; transition: border-color 0.15s ease; }
.submit-textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }
.submit-char-count { font-size: 0.7rem; color: var(--text-muted); text-align: right; }

/* Input */
.submit-input { width: 100%; padding: 0.6rem 0.65rem; border: 1px solid var(--border-color); border-radius: 0.5rem; background: var(--card-bg); color: var(--text-primary); font-size: 0.85rem; transition: border-color 0.15s ease; }
.submit-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.1); }

/* Checkbox */
.submit-check { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--text-primary); cursor: pointer; }
.submit-check input { width: 1rem; height: 1rem; accent-color: #3b82f6; }

/* Error */
.submit-error { font-size: 0.75rem; color: #ef4444; font-weight: 600; display: none; }
.submit-error.visible { display: block; }

/* Submit Button */
.submit-btn { width: 100%; padding: 0.75rem; border-radius: 0.6rem; border: none; background: #3b82f6; color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.15s ease; }
.submit-btn:hover { background: #1e40af; transform: translateY(-1px); }

/* Mobile */
@media (max-width: 500px) {
    .submit-categories { grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
    .submit-cat { padding: 0.5rem 0.3rem; }
    .submit-cat-icon { font-size: 1.1rem; }
    .submit-cat-name { font-size: 0.65rem; }
}
</style>

<script>
// Category selection
document.querySelectorAll('.submit-cat').forEach(function(cat) {
    cat.addEventListener('click', function() {
        document.querySelectorAll('.submit-cat').forEach(function(c) { c.classList.remove('selected'); });
        this.classList.add('selected');
        this.querySelector('input').checked = true;
        document.getElementById('categoryError').classList.remove('visible');
    });
});

// Character count
document.getElementById('feedbackText').addEventListener('input', function() {
    var len = this.value.length;
    document.getElementById('charCount').textContent = len;
    if (len >= 10) document.getElementById('textError').classList.remove('visible');
});

// Form validation
document.getElementById('feedbackForm').addEventListener('submit', function(e) {
    var valid = true;
    if (!document.querySelector('input[name="category"]:checked')) {
        document.getElementById('categoryError').classList.add('visible');
        valid = false;
    }
    if (document.getElementById('feedbackText').value.trim().length < 10) {
        document.getElementById('textError').classList.add('visible');
        valid = false;
    }
    if (!valid) e.preventDefault();
});
</script>
{% endblock %}
