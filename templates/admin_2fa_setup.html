{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">🔐</div>
            <h1>Setup Two-Factor Authentication</h1>
            <p>Scan the QR code with your authenticator app</p>
        </div>
        
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        
        <div class="text-center mb-4">
            <div class="qr-code-container">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data={{ totp_uri | urlencode }}" 
                     alt="2FA QR Code" class="qr-code">
            </div>
            <p class="text-secondary small">Can't scan? Enter this code manually:</p>
            <code class="secret-code">{{ secret }}</code>
        </div>
        
        <form method="POST" action="/admin/2fa/setup">
            {{ csrf_field() }}
            <div class="form-group">
                <label for="token">Enter the 6-digit code from your app</label>
                <input type="text" id="token" name="token" 
                       class="form-input" placeholder="000000" 
                       maxlength="6" pattern="[0-9]{6}" required
                       autocomplete="one-time-code" inputmode="numeric">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Enable 2FA</button>
        </form>
        
        <div class="auth-footer">
            <a href="/admin/dashboard">← Back to dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
