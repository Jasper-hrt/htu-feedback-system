{% if session and session.get('student_id') %}
<style>
/* Mobile sidebar toggle styles — used on every student page */
.sd-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    z-index: 99;
    backdrop-filter: blur(3px);
}
.sd-overlay.open { display: block; }

.admin-sidebar.sd-sidebar {
    position: sticky;
    flex: 0 0 16rem;
    width: 16rem;
    top: calc(var(--nav-height, 4rem) + 1.5rem);
    align-self: flex-start;
    max-height: calc(100vh - var(--nav-height, 4rem) - 2rem);
    overflow-y: auto;
    scrollbar-width: thin;
}
html.theme-dark .admin-sidebar.sd-sidebar {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.10), rgba(59, 130, 246, 0.06));
    border-color: rgba(148, 163, 184, 0.18);
}

.sd-hamburger {
    display: none;
    align-items: center;
    justify-content: center;
    width: 2.4rem;
    height: 2.4rem;
    border-radius: 0.6rem;
    border: 1px solid var(--border-color);
    background: var(--bg-color);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 1.1rem;
}
.sd-hamburger:hover { border-color: var(--primary); }

@media (max-width: 900px) {
    .admin-sidebar.sd-sidebar {
        position: fixed;
        left: 0;
        top: var(--nav-height, 4rem);
        bottom: 0;
        margin: 0;
        width: 16rem;
        max-height: none;
        border-radius: 0 18px 18px 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
        z-index: 100;
        transition: transform 0.25s ease;
    }
    .admin-sidebar.sd-sidebar.open { transform: translateX(0); }
    .sd-hamburger { display: inline-flex !important; }
}
@media (min-width: 901px) {
    .admin-sidebar.sd-sidebar { transform: none !important; }
    .sd-overlay { display: none !important; }
    .sd-hamburger { display: none !important; }
}
</style>

<div class="sd-overlay" id="sdOverlay" onclick="toggleStudentSidebar()"></div>

<aside class="admin-sidebar sd-sidebar" id="sdSidebar" aria-label="Student sidebar">
    <div class="admin-sidebar-title">
        🎓 Student Portal
        <span class="sub">Feedback &amp; support</span>
    </div>
    <nav class="admin-sidebar-nav">
        <a href="/student/dashboard" class="admin-sidebar-link {% if request.path.startswith('/student/dashboard') %}admin-sidebar-link-active{% endif %}">📋 Dashboard</a>
        <a href="/submit" class="admin-sidebar-link {% if request.path == '/submit' or request.path.startswith('/submit_feedback') %}admin-sidebar-link-active{% endif %}">✍️ Submit Feedback</a>
        <a href="/forum" class="admin-sidebar-link {% if request.path.startswith('/forum') %}admin-sidebar-link-active{% endif %}">💬 Forum</a>
        <a href="/chat" class="admin-sidebar-link {% if request.path.startswith('/chat') %}admin-sidebar-link-active{% endif %}">💬 Chat</a>
        <a href="/announcements" class="admin-sidebar-link {% if request.path.startswith('/announcements') %}admin-sidebar-link-active{% endif %}">📢 Announcements</a>
        <a href="/public" class="admin-sidebar-link {% if request.path.startswith('/public') %}admin-sidebar-link-active{% endif %}">📊 Public Board</a>
    </nav>
    <div style="margin-top: 1.25rem;">
        <a href="/student/change-password" class="admin-sidebar-link {% if request.path.startswith('/student/change-password') %}admin-sidebar-link-active{% endif %}">🔑 Settings</a>
        <form method="POST" action="/student/logout" style="margin:0.5rem 0 0;">
            {{ csrf_field() }}
            <button type="submit" class="btn-logout btn-logout--student student-sidebar-logout" style="width:100%; text-align:left;">
                <span class="btn-logout-icon">⏻</span>
                <span><span class="btn-logout-text">Logout</span><span class="btn-logout-subtext">Student session</span></span>
            </button>
        </form>
    </div>
</aside>

<script>
function toggleStudentSidebar() {
    var sidebar = document.getElementById('sdSidebar');
    var overlay = document.getElementById('sdOverlay');
    var btn = document.getElementById('sdHamburgerBtn');
    if (sidebar && overlay) {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
        if (btn) btn.classList.toggle('active');
    }
}
</script>
{% endif %}
